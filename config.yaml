model:
  model_id: "openai/whisper-large-v3-turbo"
  language: "spanish"  # Base language setting for Whisper tokenization
  task: "transcribe"
  sampling_rate: 16000
  use_flash_attention_2: false  # Enable if hardware supports FlashAttention-2 (Ampere+ / A100)
  torch_dtype: "bfloat16"  # "bfloat16" or "float16" or "float32"

data:
  train_manifest: "nahuatl_dev/metadata.tsv"
  train_audio_dir: "nahuatl_dev/clips"
  # The cloned data has no separate training/validation split.
  val_manifest: ""
  val_audio_dir: "nahuatl_dev/clips"
  audio_column: "audio_filename"
  text_column: "transcript"
  max_duration_seconds: 30.0
  min_duration_seconds: 0.5
  num_proc: 4

training:
  output_dir: "./output/whisper-large-v3-turbo-spanish-nahuatl"
  use_lora: true
  num_train_epochs: 5
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 4
  learning_rate: 1.0e-4
  warmup_ratio: 0.1
  lr_scheduler_type: "cosine"
  weight_decay: 0.01
  logging_steps: 25
  eval_steps: 100
  save_steps: 100
  save_total_limit: 3
  evaluation_strategy: "steps"
  save_strategy: "steps"
  load_best_model_at_end: true
  metric_for_best_model: "wer"
  greater_is_better: false
  fp16: false
  bf16: true
  gradient_checkpointing: true
  dataloader_num_workers: 4
  predict_with_generate: true
  generation_max_length: 225

lora:
  r: 32
  lora_alpha: 64
  target_modules: ["q_proj", "v_proj", "k_proj", "out_proj", "fc1", "fc2"]
  lora_dropout: 0.05
  bias: "none"

inference:
  batch_size: 16
  beam_size: 1  # Greedy decode (fastest for large-v3-turbo)
  max_new_tokens: 225
  torch_dtype: "float16"
